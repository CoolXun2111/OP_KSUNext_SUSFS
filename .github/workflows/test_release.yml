name: TEST Create and Publish Release

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true

jobs:
  trigger-release:
    runs-on: [self-hosted, ubuntu-24.04]
    if: ${{ inputs.make_release }}
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      RELEASE_NAME: "Test Fast Release"
      RELEASE_NOTES: |
        This is a test release to test tagging and publishing using PAT.

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Generate and Create New Tag
        run: |
          set -x

          # Recupera l'ultimo tag
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' || echo "test-r0")
          echo "Latest tag: $LATEST_TAG"

          # Se l'ultimo tag non è del tipo corretto, parte da test-r0
          if [[ "$LATEST_TAG" != test-* ]]; then
            LATEST_TAG="test-r0"
          fi

          # Calcola il nuovo tag incrementale
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{v=$2+1; print $1"-r"v}')
          
          # Verifica che il tag sia unico
          while gh api repos/$REPO_OWNER/$REPO_NAME/git/refs/tags | grep -q "\"ref\": \"refs/tags/$NEW_TAG\""; do
            NEW_TAG=$(echo "$NEW_TAG" | awk -F'-r' '{v=$2+1; print $1"-r"v}')
          done

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated unique tag: $NEW_TAG"

          # Configura git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Controlla se ci sono modifiche a workflow files
          if git diff --name-only HEAD~1 HEAD | grep -q ".github/workflows/"; then
            echo "⚠️ Workflow files modified, creating empty commit..."
            git commit --allow-empty -m "Empty commit to avoid workflow permission issue"
            git push
          else
            echo "✅ No workflow changes detected."
          fi

          # Crea e pusha il nuovo tag
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Create GitHub Release with Retry
        run: |
          set -x
          ATTEMPTS=0
          MAX_ATTEMPTS=3
          DELAY_SECONDS=10

          while true; do
            set +e
            echo "Attempt $((ATTEMPTS+1)) to create GitHub Release..."
            gh release create "${{ env.NEW_TAG }}" --title "${{ env.RELEASE_NAME }}" --notes "${{ env.RELEASE_NOTES }}" --prerelease
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ GitHub Release created successfully!"
              break
            fi

            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "❌ Failed to create GitHub Release after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            echo "⚠️ GitHub Release creation failed (attempt $ATTEMPTS). Retrying in $DELAY_SECONDS seconds..."
            sleep $DELAY_SECONDS
          done
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
          NEW_TAG: ${{ env.NEW_TAG }}
