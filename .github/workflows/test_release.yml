name: TEST Create and Publish Release

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true

jobs:
  trigger-release:
    runs-on: [self-hosted, ubuntu-24.04]
    if: ${{ inputs.make_release }}
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      RELEASE_NAME: "Test Fast Release"
      RELEASE_NOTES: |
        This is a test release to test tagging and publishing using PAT.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

#      - name: Generate and Create New Tag
#        run: |
#          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' || echo "test-r0")
#          echo "Latest tag: $LATEST_TAG"
#
#          if [[ "$LATEST_TAG" != test-* ]]; then
#            LATEST_TAG="test-r0"
#          fi
#
#          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{v=$2+1; print $1"-r"v}')
#          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
#
#          git config user.name "github-actions[bot]"
#          git config user.email "github-actions[bot]@users.noreply.github.com"
#
#          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
#            echo "Tag $NEW_TAG already exists locally, skipping local creation."
#          else
#            git tag "$NEW_TAG"
#          fi
#
#          if git ls-remote --tags origin | grep "refs/tags/$NEW_TAG$"; then
#            echo "Tag $NEW_TAG already exists on remote, skipping push."
#          else
#            git push origin "$NEW_TAG"
#          fi
#
      - name: Generate and Create New Tag
        run: |
          set -x
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' || echo "op10pro-r0")
          echo "Latest tag: $LATEST_TAG"

          if [[ "$LATEST_TAG" != op10pro-* ]]; then
            LATEST_TAG="op10pro-r0"
          fi

          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{v=$2+1; print $1"-r"v}')
          while git ls-remote --tags origin | grep -q "refs/tags/$NEW_TAG$"; do
            NEW_TAG=$(echo "$NEW_TAG" | awk -F'-r' '{v=$2+1; print $1"-r"v}')
          done
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated unique tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: true
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
