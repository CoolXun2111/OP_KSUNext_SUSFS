name: Build and Release OnePlus Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      build_sm8450:
        description: 'Build sm8450 (OP10Pro)?'
        required: true
        type: boolean
        default: true
      build_sm8750:
        description: 'Build sm8750 (OP13)?'
        required: true
        type: boolean
        default: true

jobs:
  build-sm8450:
    if: ${{ inputs.build_sm8450 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP10pro
            soc: waipio
            branch: oneplus/sm8450
            manifest: oneplus_10_pro_v.xml
            android_version: android12
            kernel_version: "5.10"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: ${{ matrix.branch }}
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  build-sm8750:
    if: ${{ inputs.build_sm8750 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP13
            soc: sun
            branch: oneplus/sm8750
            manifest: JiuGeFaCai_oneplus_13_v.xml
            android_version: android15
            kernel_version: "6.6"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: ${{ matrix.branch }}
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  trigger-release:
    needs:
      - build-sm8450
      - build-sm8750
    runs-on: ubuntu-latest
    if: ${{ inputs.make_release }}
    env:
      REPO_OWNER: luigimak
      REPO_NAME: OP_KSUNext_SUSFS
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "*TEST BUILD* OnePlus Kernels With KernelSU Next & SUSFS v1.5.5 *TEST BUILD*"
      RELEASE_NOTES: |
        This release contains KernelSU Next and SUSFS v1.5.5

        Module: 
        -> https://github.com/sidex15/ksu_module_susfs

        Non-Official Managers:
        -> https://github.com/KernelSU-Next/KernelSU-Next

        Features:
        [+] KernelSU-Next
        [+] SUSFS v1.5.5
        [+] Wireguard Support
        [+] Maphide LineageOS Detections
        [+] Futile Maphide for jit-zygote-cache Detections
        [+] Magic Mount Support

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download KernelSU Version
        uses: actions/download-artifact@v4
        with:
          name: kernelsu-version
          path: ./ksu

      - name: Read KernelSU Version
        run: |
          KSUVER=$(cat ./ksu/ksuver.txt)
          echo "KSUVER=$KSUVER"
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV


      - name: Generate and Create New Tag
        run: |
          KSUVER="${{ env.KSUVER }}"

          EXISTING=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[].name' | grep "^$KSUVER" || true)

          if [ -z "$EXISTING" ]; then
            NEW_TAG="${KSUVER}-r0"
          else
            LAST_SUFFIX=$(echo "$EXISTING" | sed "s/^${KSUVER}-r//" | sort -n | tail -n1)
            NEW_TAG="${KSUVER}-r$((LAST_SUFFIX + 1))"
          fi

          echo "✅ Generated tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: true
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/kernel-*/*; do
              if [ -d "$file" ]; then
                  continue
              fi
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ env.NEW_TAG }}

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*
