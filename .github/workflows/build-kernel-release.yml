name: Build and Release OnePlus Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      run_sm8450:
        description: 'Run SM8450 build?'
        required: true
        type: boolean
        default: true
      run_sm8475:
        description: 'Run SM8475 build?'
        required: true
        type: boolean
        default: true
      run_sm8550:
        description: 'Run SM8550 build?'
        required: true
        type: boolean
        default: true
      run_sm8650:
        description: 'Run SM8650 build?'
        required: true
        type: boolean
        default: true
      run_sm8750:
        description: 'Run SM8750 build?'
        required: true
        type: boolean
        default: true
      run_sm7675:
        description: 'Run SM7675 build?'
        required: true
        type: boolean
        default: true

jobs:
  build-sm8450:
    if: ${{ inputs.run_sm8450 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP10pro
            soc: waipio
            manifest: oneplus_10_pro_v.xml
            android_version: android12
            kernel_version: "5.10"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: oneplus/sm8450
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  build-sm8475:
    if: ${{ inputs.run_sm8475 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP11r
            soc: waipio
            manifest: oneplus_11r_v.xml
            android_version: android13
            kernel_version: "5.10"
          - model: OP-ACE-2
            soc: waipio
            manifest: oneplus_ace2_v.xml
            android_version: android13
            kernel_version: "5.10"
          - model: OP10t
            soc: waipio
            manifest: oneplus_10t_v.xml
            android_version: android12
            kernel_version: "5.10"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: oneplus/sm8475
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  build-sm8550:
    if: ${{ inputs.run_sm8550 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP11
            soc: kalama
            manifest: oneplus_11_v.xml
            android_version: android13
            kernel_version: "5.15"
          - model: OP-OPEN
            soc: kalama
            manifest: oneplus_open_v.xml
            android_version: android13
            kernel_version: "5.15"
          - model: OP-ACE-2-PRO
            soc: kalama
            manifest: oneplus_ace2pro_v.xml
            android_version: android13
            kernel_version: "5.15"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: oneplus/sm8550
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  build-sm8650:
    if: ${{ inputs.run_sm8650 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP12
            soc: pineapple
            manifest: oneplus12_v.xml
            android_version: android14
            kernel_version: "6.1"
          - model: OP13r
            soc: pineapple
            manifest: oneplus_13r.xml
            android_version: android14
            kernel_version: "6.1"
          - model: OP-ACE-5
            soc: pineapple
            manifest: oneplus_ace5.xml
            android_version: android14
            kernel_version: "6.1"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: oneplus/sm8650
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  build-sm8750:
    if: ${{ inputs.run_sm8750 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP13
            soc: sun
            manifest: JiuGeFaCai_oneplus_13_v.xml
            android_version: android15
            kernel_version: "6.6"
          - model: OPAce5Pro
            soc: sun
            manifest: JiuGeFaCai_oneplus_ace5_pro_v.xml
            android_version: android15
            kernel_version: "6.6"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: oneplus/sm8750
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  build-sm7675:
    if: ${{ inputs.run_sm7675 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: OP-NORD-4
            soc: pineapple
            manifest: oneplus_nord_4_v.xml
            android_version: android14
            kernel_version: "6.1"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}
      soc: ${{ matrix.soc }}
      branch: oneplus/sm7675
      manifest: ${{ matrix.manifest }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}

  trigger-release:
    needs:
      - build-sm8450
      - build-sm8475
      - build-sm8550
      - build-sm8650
      - build-sm8750
      - build-sm7675

    runs-on: ubuntu-latest
    if: ${{ inputs.make_release }}
    env:
      REPO_OWNER: TheWildJames
      REPO_NAME: OnePlus_KernelSU_SUSFS
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "*TEST BUILD* OnePlus Kernels With KernelSU Next & SUSFS v1.5.5 *TEST BUILD*"
      RELEASE_NOTES: |
        This release contains KernelSU Next and SUSFS v1.5.5

        Module: 
        -> https://github.com/sidex15/ksu_module_susfs

        Non-Official Managers:
        -> https://github.com/KernelSU-Next/KernelSU-Next

        Features:
        [+] KernelSU-Next
        [+] SUSFS v1.5.5
        [+] Wireguard Support
        [+] Maphide LineageOS Detections
        [+] Futile Maphide for jit-zygote-cache Detections
        [+] Magic Mount Support

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate and Create New Tag
        run: |
            BASE_VERSION="1.0.0"
            TAGS=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[].name' | grep "^${BASE_VERSION}-r" || true)
            if [ -z "$TAGS" ]; then
              REVISION=0
            else
              REVISION=$(echo "$TAGS" | sed -E "s/^${BASE_VERSION}-r([0-9]+)/\1/" | sort -nr | head -n1)
              REVISION=$((REVISION + 1))
            fi
            NEW_TAG="${BASE_VERSION}-r${REVISION}"
            echo "New tag: $NEW_TAG"
            echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: true
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/kernel-*/*; do
              if [ -d "$file" ]; then
                  continue
              fi
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ env.NEW_TAG }}

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*
